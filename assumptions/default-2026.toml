# TerraFolio assumption set — the portfolio-level calibration.
#
# Every rate, weight, floor, clamp, tolerance and band in the system lives here
# and nowhere else (spec §9.4, §10.2). Changing one must be an auditable event,
# which is why this file is in git and why its content — not its filename —
# determines `assumption_set_id`.
#
# What is NOT here: per-project rates. With statements ingested, each project
# file declares its own tax rate, debt terms, escalators and degradation, so
# per-fund rate configuration has narrowed to what is genuinely portfolio-level.
# See docs/decisions.md.
#
# Units: money in euros unless a key says otherwise, shares and rates as
# fractions of one, energy in GWh, prices in EUR/MWh.

[meta]
# Metadata is deliberately EXCLUDED from assumption_set_id. Fixing a typo in a
# label must not invalidate the comparability of every run stored against it.
label = "Default 2026"
version = 1
created_by = "terrafolio"
supersedes = ""

# --- Portfolio-level economics ------------------------------------------------

[exit_multiples]
# EV/EBITDA at exit, by technology (§9.4). Keyed by the Technology enum.
solar = 9.0
onshore_wind = 8.5
offshore_wind = 9.5

[lcoe]
real_discount_rate = 0.06

[emissions]
co2_t_per_mwh = 0.32

# --- The objective (§10.2) ----------------------------------------------------
#
# Floors and clamps apply to the NORMALISED term, before the weight multiplies:
# capacity scores `1 - |mw - target| / target` floored at -0.6, so the term
# bottoms out at 3.2 x -0.6 = -1.92.

[objective]
capacity_weight = 3.2
capacity_score_floor = -0.6

tech_split_weight = 3.0
tech_split_score_floor = -0.5
# The bare 0.35 in §10.2's tech-split term. It is a tolerance, so it is
# configuration exactly as much as the weights are.
tech_split_tolerance = 0.35

return_weight = 2.6
return_clamp = 1.2
# The 5-point scale the IRR-vs-hurdle gap is normalised by.
return_scale = 0.05

utilisation_weight = 0.9

# Penalties, stated signed: the objective adds `weight * breach`.
leverage_weight = -7.0
merchant_weight = -14.0
country_concentration_weight = -8.0
project_concentration_weight = -8.0
risk_weight = -1.6

# An empty portfolio has equity 0 and is therefore technically feasible, so it
# is checked first and scored exactly this (§10.2).
empty_portfolio_score = -50.0

# Epic §6.2. A single rejection constant makes every over-budget chromosome
# indistinguishable and leaves selection nothing to work with; the mockup's
# graded `-20 - equity/capital` sits ABOVE the worst feasible score of about
# -44, so an infeasible portfolio could outrank a feasible one. This grade is
# always below -50 and monotone in the overshoot.
reject_base = -1000.0
reject_slope = -100.0
# The utilisation reward actively pushes portfolios onto the equity cap, so a
# portfolio landing exactly on it must not be rejected by a rounding artefact.
equity_cap_tolerance_eur = 1.0

# The GA trajectory turns on `f[a] >= f[b]`. One last-bit BLAS difference flips
# a tournament and diverges the entire run, so fitness is quantised before any
# comparison.
quantisation_dp = 6

# --- The genetic algorithm (§10.1, epic §6.1) ---------------------------------

[ga]
mutation_rate = 0.025
tournament_size = 2
elite_count = 2

# Epic §6.1. §10.1's flat 0.35 is calibrated for the mockup's 48-project
# pipeline; at 300-500 candidates it selects far more projects than any budget
# can fund, every chromosome lands in the rejection band, and the run returns
# garbage while looking converged. Inclusion is scaled from the mandate instead,
# with 0.35 surviving as the ceiling.
inclusion_ceiling = 0.35
inclusion_floor = 0.005

[ga.effort.fast]
population = 50
generations = 35

[ga.effort.standard]
population = 90
generations = 60

[ga.effort.exhaustive]
population = 160
generations = 110

# --- Risk appetite (§5.3) -----------------------------------------------------
#
# Two different caps. The project cap is a hard pre-screen on a single project's
# development risk score; the portfolio cap is a soft, capex-weighted penalty.

[risk_caps.project]
low = 2.6
balanced = 3.6
high = 5.0

[risk_caps.portfolio]
low = 2.4
balanced = 3.2
high = 4.2

# --- Live feasibility feedback (§5.4) -----------------------------------------

[feasibility]
# "the solar target is more than 20 points away from the eligible pool's mix"
solar_divergence_tolerance = 0.20
# "the eligible pool absorbs less than 90% of available capital"
capital_absorption_floor = 0.90

# --- The tie-out validator (docs/pipeline-schema.md §7, §10) -------------------

[validation]
# Whichever is looser. Cited by the schema document under exactly these keys.
tolerance_abs_m = 0.01
tolerance_rel = 0.001

[validation.capacity_factor]
low = 0.05
high = 0.60

[validation.min_dscr_band]
# The band stabilised-EBITDA sizing produces (epic §6.3).
low = 1.20
high = 2.50

[validation.capex_per_kw.solar]
low = 560.0
high = 950.0

[validation.capex_per_kw.onshore_wind]
low = 1050.0
high = 1700.0

[validation.capex_per_kw.offshore_wind]
low = 2200.0
high = 3400.0

[validation.stage_gearing_ceiling]
greenfield = 0.65
ready_to_build = 0.72
construction = 0.75

# --- Interpretations the specification leaves open ----------------------------
#
# Both are flags rather than code so issue 2C's sweep can test each combination
# against the reference and pin the one that matches.

[interpretation]
# Both pinned by the sweep in tests/golden/test_interpretations.py against 1C's
# derived_expectations.json, not by argument. See docs/decisions.md A-23, A-24.

# Does the exit year's own FCFE count alongside the terminal value, or does the
# terminal value replace it? Counting it reproduces all 144 oracle cases to
# within an ulp; replacing it reproduces none of them.
exit_year_fcfe_included = true

# What §9.4's "PV of opex" is discounted from, and whether it escalates.
# Unescalated opex discounted from the model base year reproduces all 48
# reference LCOEs exactly. Issue #8 offered two readings and neither is this
# one: discounting from COD matches 10 of 48 and misses by up to 16 EUR/MWh,
# and escalating the opex matches none. Capex enters undiscounted at t0 under
# every reading. The value is spelled as economics/lcoe.py's REAL_FROM_BASE,
# which owns the vocabulary; 2A and 2C reached this answer independently
# (2A-4 and A-24).
lcoe_opex_basis = "real_from_base"

# --- The seed-pipeline generator (§9.1-9.4) -----------------------------------
#
# Used to produce the shipped pipeline and to check ingested files. Values match
# the JavaScript reference so that, seeded to match, the generator reproduces
# its 48 projects field for field.

[generator]
base_year = 2027
cod_first_year = 2027
cod_last_year = 2033
# 8760 hours with the MWh-to-GWh division folded in, exactly as the reference
# writes it: MW x 8.760 x capacity factor is GWh. Kept folded so the parity test
# holds bit-for-bit rather than to within a rounding.
hours_per_year_gwh = 8.760
# The first operating year is partial (§9.2).
ramp_factor = 0.55
tax_rate = 0.20
depreciation_years = 25
debt_rate = 0.055
debt_tenor_years = 18
# Epic §6.3: sized off stabilised first-full-year EBITDA, then capped by the
# stage gearing ceiling, so min DSCR lands two-sided around this figure.
target_dscr = 1.40
price_escalation = 0.005
merchant_escalation = 0.021
opex_escalation = 0.021
# Below this contracted share a project is treated as fully merchant and draws
# no tenor (§4.3: a zero tenor requires a zero share). The shipped mix never
# reaches it, and it is here so that a re-calibrated mix cannot emit a file
# with a contracted share and no term to run it over.
contracted_share_floor = 0.05
contract_tenor_choices = [10, 12, 15, 15, 20]
# A generated project whose min DSCR falls outside the §10 plausibility band is
# redrawn from its own stream rather than shipped with a warning, so
# `pipeline generate` produces a pipeline that loads clean. Bounded: a site the
# band cannot accommodate at all is a data problem to report, not to retry
# forever. Unused by the reference-parity mode, whose 48 projects already land
# inside the band.
dscr_resample_attempts = 24

# --- What the shipped pipeline is made of -------------------------------------
#
# The reference corpus is a fixed 48-site table. A 300- or 2,000-project pipeline
# is drawn to these shares instead, across the 14 markets in baseload_price.
# Site names, coordinates and the markets themselves are geography rather than
# calibration, and live in src/terrafolio/generate/countries.json.

[generator.technology_mix]
solar = 0.45
onshore_wind = 0.44
offshore_wind = 0.11

[generator.stage_mix]
greenfield = 0.36
ready_to_build = 0.41
construction = 0.23

[generator.capacity_mw.solar]
low = 55.0
span = 265.0

[generator.capacity_mw.onshore_wind]
low = 45.0
span = 175.0

[generator.capacity_mw.offshore_wind]
low = 280.0
span = 220.0

# Years past cod_first_year, by stage: a project under construction commissions
# almost immediately, a greenfield one is years out. This is what spreads COD
# across the §5.2 window instead of bunching it.

[generator.cod_offset.greenfield]
low = 3.0
span = 4.0

[generator.cod_offset.ready_to_build]
low = 1.0
span = 3.0

[generator.cod_offset.construction]
low = 0.0
span = 2.0

# --- Ranges the generator draws from ------------------------------------------
#
# Stated as `low` and `span`, and drawn as `low + u x span`, because that is what
# the arithmetic does. Stating a `high` instead and subtracting would be exact
# for some of these and not others -- 1.06 - 0.94 is 0.1200000000000001, not
# 0.12 -- and the difference lands in `netCapacityFactor`, which is emitted at
# full precision and multiplies every year of generation. A `band` elsewhere in
# this file is a bound something is tested against; a `range` is one a value is
# drawn from, and only the second needs its width to be exact.

# Entry yield is jittered around the stage figure (§9.1): +/- 0.7 points, so a
# range 0.014 wide starting 0.007 below.
[generator.entry_yield_jitter]
low = -0.007
span = 0.014

# Multiplicative jitter on a market's P50 capacity factor.
[generator.capacity_factor_jitter]
low = 0.94
span = 0.12

# Contracted price as a fraction of the capture price.
[generator.contract_price_factor]
low = 0.86
span = 0.14

[generator.degradation]
solar = 0.005
onshore_wind = 0.002
offshore_wind = 0.002

[generator.capture_factor]
solar = 0.68
onshore_wind = 0.88
offshore_wind = 0.86

[generator.entry_yield]
# By stage, with offshore wind overriding the stage figure (§9.1).
greenfield = 0.116
ready_to_build = 0.103
construction = 0.095
offshore_override = 0.090

[generator.opex_per_kw_year.solar]
low = 12.0
span = 4.0

[generator.opex_per_kw_year.onshore_wind]
low = 42.0
span = 12.0

[generator.opex_per_kw_year.offshore_wind]
low = 78.0
span = 20.0

[generator.offshore_capacity_factor]
low = 0.49
span = 0.06

[generator.contracted_share.greenfield]
low = 0.15
span = 0.5

[generator.contracted_share.ready_to_build]
low = 0.45
span = 0.4

[generator.contracted_share.construction]
low = 0.65
span = 0.3

[generator.development_risk_base]
greenfield = 3.4
ready_to_build = 2.2
construction = 1.5

[generator.development_risk]
offshore_premium = 0.8
jitter = 1.2
low = 1.0
