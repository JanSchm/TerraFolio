name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be re-triggered by hand when GitHub drops a synchronize event,
  # rather than pushing an empty commit to nudge it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen, not --locked: the lockfile is part of the reproducibility
      # contract (epic §5 records the numpy version on every run), so CI must
      # fail rather than silently re-resolve.
      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest
