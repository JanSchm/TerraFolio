name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be re-triggered by hand when GitHub drops a synchronize event,
  # rather than pushing an empty commit to nudge it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen, not --locked: the lockfile is part of the reproducibility
      # contract (epic §5 records the numpy version on every run), so CI must
      # fail rather than silently re-resolve.
      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest

  # Nothing under web/ was verified on main before this job existed: #5's axe,
  # contrast, keyboard and copy guards and #10's accessibility tests all ran only
  # on the author's machine. `npm test` runs the Tailwind build first through
  # pretest, which tests/offline.test.js requires.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: the lockfile is the contract, as it is on the Python side.
      - name: Install the locked front-end toolchain
        run: npm --prefix web ci

      - name: Tests
        run: npm --prefix web test
