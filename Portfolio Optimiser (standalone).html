document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lor-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"2359afef-8f82-4cfb-ac66-934d1894f6e8\"><\u002Fscript>\n<script src=\"cfa92e42-e466-4bab-afd8-8cb172a65dc9\" integrity=\"sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"be8da16e-9119-42bc-9308-0eeeee09bf7c\" integrity=\"sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67\" crossorigin=\"anonymous\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #f2f2f3; }\n  @keyframes om-spin { to { transform: rotate(360deg); } }\n  @keyframes om-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 16px;\">\n\n  <div class=\"nav\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--color-divider); position: sticky; top: 0; background: var(--color-bg); z-index: 40;\">\n    <div style=\"display: flex; align-items: baseline; gap: 14px;\">\n      <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: 19px; letter-spacing: 0.02em;\">MERIDIAN&nbsp;CAPITAL<\u002Fspan>\n      <span style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">Renewables portfolio optimiser<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 18px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-family: var(--font-heading);\">\n      <span style=\"color: {{ stepColor1 }};\">01 Mandate<\u002Fspan>\n      <span style=\"color: color-mix(in srgb, var(--color-text) 30%, transparent);\">—<\u002Fspan>\n      <span style=\"color: {{ stepColor2 }};\">02 Search<\u002Fspan>\n      <span style=\"color: color-mix(in srgb, var(--color-text) 30%, transparent);\">—<\u002Fspan>\n      <span style=\"color: {{ stepColor3 }};\">03 Portfolio<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isInput }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"max-width: 1440px; margin: 0 auto; padding: 28px 24px 140px;\">\n\n      <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 22px;\">\n        <div style=\"max-width: 640px;\">\n          <h1 style=\"font-size: 40px; margin: 0 0 6px;\">Define the mandate<\u002Fh1>\n          <p style=\"margin: 0; color: var(--color-neutral-700); max-width: 60ch; text-wrap: pretty;\">The optimiser searches the live candidate pipeline for the subset of projects that best satisfies the objective while respecting every hard constraint below.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-size: 14.5px; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">Pipeline: {{ poolCount }} screened candidates · {{ poolMw }} MW<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; align-items: start;\">\n\n        <div class=\"blueprint\" style=\"padding: 20px 20px 22px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h6 style=\"margin: 0 0 4px; font-size: 15px; color: var(--color-accent-700);\">Objective<\u002Fh6>\n          <p style=\"font-size: 14px; color: var(--color-neutral-700); margin: 0 0 20px;\">What the portfolio is asked to achieve.<\u002Fp>\n\n          <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n            <div>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px;\">\n                <label style=\"font-size: 15px; font-weight: 500; letter-spacing: 0.01em;\">Available equity capital<\u002Flabel>\n                <span style=\"font-family: var(--font-heading); font-size: 22px;\">€{{ v.capitalLabel }}m<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"200\" max=\"4000\" step=\"50\" value=\"{{ v.capital }}\" sc-camel-on-change=\"{{ h.capital }}\" style=\"width: 100%; height: 26px; cursor: pointer; accent-color: var(--color-accent);\">\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px;\">\n                <label style=\"font-size: 15px; font-weight: 500; letter-spacing: 0.01em;\">Capacity target<\u002Flabel>\n                <span style=\"font-family: var(--font-heading); font-size: 22px;\">{{ v.targetLabel }} MW<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"200\" max=\"4000\" step=\"50\" value=\"{{ v.target }}\" sc-camel-on-change=\"{{ h.target }}\" style=\"width: 100%; height: 26px; cursor: pointer; accent-color: var(--color-accent);\">\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px;\">\n                <label style=\"font-size: 15px; font-weight: 500; letter-spacing: 0.01em;\">Technology split<\u002Flabel>\n                <span style=\"font-family: var(--font-heading); font-size: 15px;\">{{ v.solarPct }}% solar / {{ v.windPct }}% wind<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position: relative; height: 30px; border: 1px solid var(--color-divider); margin-top: 4px;\">\n                <div style=\"position: absolute; inset: 0; display: flex;\">\n                  <div style=\"background: var(--color-accent); width: {{ v.solarPct }}%; overflow: hidden; display: flex; align-items: center; padding-left: 8px;\">\n                    <span style=\"font-family: var(--font-heading); font-size: 11px; letter-spacing: 0.12em; color: var(--color-bg); white-space: nowrap;\">SOLAR<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"background: var(--color-accent-300); flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px;\">\n                    <span style=\"font-family: var(--font-heading); font-size: 11px; letter-spacing: 0.12em; color: var(--color-accent-900); white-space: nowrap;\">WIND<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position: absolute; top: -5px; bottom: -5px; width: 9px; left: {{ v.solarPct }}%; transform: translateX(-50%); background: var(--color-text); pointer-events: none;\"><\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ v.solarPct }}\" sc-camel-on-change=\"{{ h.solarShare }}\" aria-label=\"Solar share\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px;\">\n                <label style=\"font-size: 15px; font-weight: 500; letter-spacing: 0.01em;\">Target equity IRR (hurdle)<\u002Flabel>\n                <span style=\"font-family: var(--font-heading); font-size: 22px;\">{{ v.hurdle }}%<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"6\" max=\"18\" step=\"0.5\" value=\"{{ v.hurdle }}\" sc-camel-on-change=\"{{ h.hurdle }}\" style=\"width: 100%; height: 26px; cursor: pointer; accent-color: var(--color-accent);\">\n            <\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 14px;\">\n              <div class=\"field\">\n                <label style=\"display: block; font-size: 14px; margin-bottom: 6px; color: var(--color-neutral-800);\">Hold period (yrs)<\u002Flabel>\n                <input class=\"input\" type=\"number\" min=\"5\" max=\"30\" step=\"1\" value=\"{{ v.hold }}\" sc-camel-on-change=\"{{ h.hold }}\" style=\"width: 100%; font-size: 16px; min-height: 44px; background: var(--color-neutral-100); border-color: var(--color-neutral-400);\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label style=\"display: block; font-size: 14px; margin-bottom: 6px; color: var(--color-neutral-800);\">Exit year<\u002Flabel>\n                <input class=\"input\" type=\"text\" value=\"{{ v.exitYear }}\" readonly=\"readonly\" style=\"width: 100%; opacity: 0.6;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"blueprint\" style=\"padding: 20px 20px 22px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h6 style=\"margin: 0 0 4px; font-size: 15px; color: var(--color-accent-700);\">Hard constraints<\u002Fh6>\n          <p style=\"font-size: 14px; color: var(--color-neutral-700); margin: 0 0 20px;\">Breaches are rejected, not penalised.<\u002Fp>\n\n          <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n            <div>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;\">\n                <label style=\"font-size: 15px; font-weight: 500; letter-spacing: 0.01em;\">Eligible countries<\u002Flabel>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ h.allCountries }}\" style=\"font-size: 13px; white-space: nowrap;\">{{ countryToggleLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n                <sc-for list=\"{{ countryChips }}\" as=\"c\" hint-placeholder-count=\"14\">\n                  <button class=\"{{ c.cls }}\" sc-camel-on-click=\"{{ c.toggle }}\" style=\"cursor: pointer; font-family: var(--font-heading); font-size: 14px; padding: 7px 12px; letter-spacing: 0.01em; white-space: nowrap;\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px;\">\n                <label style=\"font-size: 15px; font-weight: 500; letter-spacing: 0.01em;\">Min portfolio leverage<\u002Flabel>\n                <span style=\"font-family: var(--font-heading); font-size: 22px;\">{{ v.minLev }}%<\u002Fspan>\n              <\u002Fdiv>\n              <input type=\"range\" min=\"0\" max=\"85\" step=\"1\" value=\"{{ v.minLev }}\" sc-camel-on-change=\"{{ h.minLev }}\" style=\"width: 100%; height: 26px; cursor: pointer; accent-color: var(--color-accent);\">\n            <\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 14px;\">\n              <div class=\"field\">\n                <label style=\"display: block; font-size: 14px; margin-bottom: 6px; color: var(--color-neutral-800);\">Min DSCR (P50)<\u002Flabel>\n                <input class=\"input\" type=\"number\" min=\"1\" max=\"2\" step=\"0.05\" value=\"{{ v.minDscr }}\" sc-camel-on-change=\"{{ h.minDscr }}\" style=\"width: 100%; font-size: 16px; min-height: 44px; background: var(--color-neutral-100); border-color: var(--color-neutral-400);\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label style=\"display: block; font-size: 14px; margin-bottom: 6px; color: var(--color-neutral-800);\">Max merchant %<\u002Flabel>\n                <input class=\"input\" type=\"number\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ v.maxMerchant }}\" sc-camel-on-change=\"{{ h.maxMerchant }}\" style=\"width: 100%; font-size: 16px; min-height: 44px; background: var(--color-neutral-100); border-color: var(--color-neutral-400);\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label style=\"display: block; font-size: 14px; margin-bottom: 6px; color: var(--color-neutral-800);\">Max / country %<\u002Flabel>\n                <input class=\"input\" type=\"number\" min=\"10\" max=\"100\" step=\"5\" value=\"{{ v.maxCountry }}\" sc-camel-on-change=\"{{ h.maxCountry }}\" style=\"width: 100%; font-size: 16px; min-height: 44px; background: var(--color-neutral-100); border-color: var(--color-neutral-400);\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label style=\"display: block; font-size: 14px; margin-bottom: 6px; color: var(--color-neutral-800);\">Max / project %<\u002Flabel>\n                <input class=\"input\" type=\"number\" min=\"5\" max=\"100\" step=\"5\" value=\"{{ v.maxProject }}\" sc-camel-on-change=\"{{ h.maxProject }}\" style=\"width: 100%; font-size: 16px; min-height: 44px; background: var(--color-neutral-100); border-color: var(--color-neutral-400);\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label style=\"display: block; font-size: 14px; margin-bottom: 6px; color: var(--color-neutral-800);\">COD from<\u002Flabel>\n                <input class=\"input\" type=\"number\" min=\"2027\" max=\"2033\" step=\"1\" value=\"{{ v.codFrom }}\" sc-camel-on-change=\"{{ h.codFrom }}\" style=\"width: 100%; font-size: 16px; min-height: 44px; background: var(--color-neutral-100); border-color: var(--color-neutral-400);\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label style=\"display: block; font-size: 14px; margin-bottom: 6px; color: var(--color-neutral-800);\">COD to<\u002Flabel>\n                <input class=\"input\" type=\"number\" min=\"2027\" max=\"2033\" step=\"1\" value=\"{{ v.codTo }}\" sc-camel-on-change=\"{{ h.codTo }}\" style=\"width: 100%; font-size: 16px; min-height: 44px; background: var(--color-neutral-100); border-color: var(--color-neutral-400);\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"blueprint\" style=\"padding: 20px 20px 22px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <h6 style=\"margin: 0 0 4px; font-size: 15px; color: var(--color-accent-700);\">Risk &amp; execution<\u002Fh6>\n          <p style=\"font-size: 14px; color: var(--color-neutral-700); margin: 0 0 20px;\">Screens applied before the search begins.<\u002Fp>\n\n          <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n            <div>\n              <label style=\"display: block; font-size: 15px; font-weight: 500; letter-spacing: 0.01em; margin-bottom: 9px;\">Development risk appetite<\u002Flabel>\n              <div class=\"seg\" style=\"display: grid; grid-template-columns: 1fr 1fr 1fr; width: 100%;\">\n                <sc-for list=\"{{ riskOptions }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <label class=\"seg-opt\" style=\"justify-content: center; font-size: 14.5px; padding: 11px 12px;\"><input type=\"radio\" name=\"riskAppetite\" checked=\"{{ r.checked }}\" sc-camel-on-change=\"{{ r.pick }}\">{{ r.label }}<\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"font-size: 13px; margin: 9px 0 0; color: var(--color-neutral-700);\">{{ riskNote }}<\u002Fp>\n            <\u002Fdiv>\n\n            <div>\n              <label style=\"display: block; font-size: 15px; font-weight: 500; letter-spacing: 0.01em; margin-bottom: 9px;\">Stages in scope<\u002Flabel>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n                <sc-for list=\"{{ stageChips }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <button class=\"{{ s.cls }}\" sc-camel-on-click=\"{{ s.toggle }}\" style=\"cursor: pointer; font-family: var(--font-heading); font-size: 14px; padding: 7px 12px; letter-spacing: 0.01em;\">{{ s.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--color-divider); padding-top: 14px;\">\n              <sc-for list=\"{{ toggles }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ t.flip }}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: transparent; border: 0; padding: 12px 2px; cursor: pointer; text-align: left; font-family: var(--font-body); font-size: 16px; color: var(--color-text);\" style-hover=\"{{ toggleHover }}\">\n                  <span>\n                    <span style=\"display: block;\">{{ t.label }}<\u002Fspan>\n                    <span style=\"display: block; font-size: 13px; color: var(--color-neutral-700);\">{{ t.note }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"flex: none; width: 48px; height: 26px; border: 1px solid var(--color-neutral-500); position: relative; background: {{ t.trackBg }};\">\n                    <span style=\"position: absolute; top: 2px; bottom: 2px; width: 20px; left: {{ t.knobLeft }}; background: {{ t.knobBg }};\"><\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position: fixed; left: 0; right: 0; bottom: 0; background: var(--color-bg); border-top: 1px solid var(--color-divider); z-index: 30;\">\n        <div style=\"max-width: 1440px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;\">\n          <div style=\"display: flex; gap: 28px; flex-wrap: wrap;\">\n            <div>\n              <div style=\"font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">Candidates passing screens<\u002Fdiv>\n              <div style=\"font-family: var(--font-heading); font-size: 27px; line-height: 1.1;\">{{ eligibleCount }} <span style=\"font-size: 15px; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">of {{ poolCount }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">Eligible capacity<\u002Fdiv>\n              <div style=\"font-family: var(--font-heading); font-size: 27px; line-height: 1.1;\">{{ eligibleMw }} MW<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">Equity required at full draw<\u002Fdiv>\n              <div style=\"font-family: var(--font-heading); font-size: 27px; line-height: 1.1;\">€{{ eligibleEquity }}m<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 14px;\">\n            <div style=\"display: flex; flex-direction: column; gap: 4px; max-width: 460px;\">\n              <sc-for list=\"{{ warnings }}\" as=\"w\" hint-placeholder-count=\"0\">\n                <div style=\"display: flex; gap: 7px; align-items: flex-start; font-size: 13.5px; color: {{ w.color }};\">\n                  <span style=\"font-family: var(--font-heading); flex: none;\">{{ w.mark }}<\u002Fspan>\n                  <span>{{ w.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ h.run }}\" disabled=\"{{ runDisabled }}\" style=\"padding: 12px 26px; font-size: 15px; letter-spacing: 0.06em; white-space: nowrap;\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              RUN OPTIMISATION\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRunning }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1000px; margin: 0 auto; padding: 72px 24px;\">\n      <div style=\"display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px;\"> ;\"><\u002Fspan>Best fitness<\u002Fspan>\n          <span style=\"display: flex; align-items: center; gap: 6px;\"><span style=\"width: 14px; height: 2px; background: var(--color-accent-300); display: inline-block;\"><\u002Fspan>Population mean<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"height: 4px; background: var(--color-neutral-200); margin: 22px 0 18px;\">\n          <div style=\"height: 100%; background: var(--color-accent); width: {{ progressPct }};\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 18px;\">\n          <sc-for list=\"{{ liveStats }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div>\n              <div style=\"font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent);\">{{ s.label }}<\u002Fdiv>\n              <div style=\"font-family: var(--font-heading); font-size: 24px; line-height: 1.15;\">{{ s.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 18px; font-size: 12.5px; font-family: var(--font-heading); letter-spacing: 0.06em; color: var(--color-neutral-700); animation: om-blink 1.6s ease-in-out infinite;\">{{ logLine }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width: 1560px; margin: 0 auto; padding: 24px 24px 80px;\">\n\n      <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px;\">\n        <div>\n          <h1 style=\"font-size: 38px; margin: 0 0 2px;\">Suggested portfolio<\u002Fh1>\n          <p style=\"margin: 0; font-size: 14px; color: var(--color-neutral-700);\">{{ resultSubtitle }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n UK'],\n    stages: ['Greenfield','Ready-to-build','Construction'],\n    minLev: 60, minDscr: 1.25, maxMerchant: 35, maxCountry: 35, maxProject: 15,\n    codFrom: 2027, codTo: 2032, risk: 'Balanced',\n    gridOnly: false, hedged: false, omOnly: false,\n    locked: [], excluded: [],\n    sortKey: 'irr', sortDir: -1,\n    q: '', fCountry: 'All', fTech: 'All', fStage: 'All', showAll: false,\n    drawer: null, exportOpen: false, hover: null, dirty: false, runRef: 'A-1'\n  };\n\n  // ── pipeline ───────────────────────────────────────────────────────────\n  buildPipeline() {\n    const raw = [\n      ['Almonte Solar','ES',39.25,-6.52,'Solar','Ready-to-build',180,2028],\n      ['Tierra Llana PV','ES',38.60,-5.90,'Solar','Greenfield',240,2030],\n      ['Ebro Valley PV','ES',41.60,-0.90,'Solar','Construction',150,2027],\n      ['Sierra Norte PV','ES',37.90,-4.80,'Solar','Ready-to-build',110,2029],\n      ['Castilla Fields','ES',41.00,-4.50,'Solar','Greenfield',300,2031],\n      ['Alqueva Solar','PT',38.20,-7.50,'Solar','Ready-to-build',95,2028],\n      ['Algarve Sol','PT',37.20,-8.00,'Solar','Greenfield',130,2030],\n      ['Guadiana Sol','PT',38.00,-7.90,'Solar','Construction',85,2027],\n      ['Puglia Sole','IT',40.90,16.90,'Solar','Ready-to-build',85,2028],\n      ['Sicilia Solare','IT',37.50,14.30,'Solar','Construction',120,2027],\n      ['Maremma PV','IT',42.80,11.10,'Solar','Greenfield',70,2030],\n      ['Thessaly Solar','GR',39.50,22.30,'Solar','Ready-to-build',105,2029],\n      ['Peloponnese PV','GR',37.50,22.20,'Solar','Greenfield',90,2030],\n      ['Attica Fields','GR',38.10,23.60,'Solar','Construction',65,2027],\n      ['Occitanie Solaire','FR',43.60,1.40,'Solar','Ready-to-build',75,2029],\n      ['Aquitaine PV','FR',44.80,-0.60,'Solar','Construction',60,2027],\n      ['Lausitz Solarpark','DE',51.60,14.30,'Solar','Ready-to-build',140,2028],\n      ['Bayern Süd PV','DE',48.40,11.60,'Solar','Greenfield',95,2030],\n      ['Wielkopolska PV','PL',52.20,17.10,'Solar','Ready-to-build',80,2029],\n      ['Dobrogea Solar','RO',44.40,28.30,'Solar','Greenfield',115,2030],\n      ['Banat Solar','RO',45.80,21.20,'Solar','Ready-to-build',70,2029],\n      ['Zeeland Zon','NL',51.50,3.90,'Solar','Construction',55,2027],\n      ['Nordjylland Vind','DK',57.10,9.90,'Wind','Ready-to-build',90,2028],\n      ['Jutland Ridge','DK',56.20,9.10,'Wind','Construction',60,2027],\n      ['Connacht Wind','IE',53.70,-8.90,'Wind','Greenfield',110,2030],\n      ['Kerry Highlands','IE',52.10,-9.50,'Wind','Ready-to-build',75,2029],\n      ['Norrland Vind','SE',64.20,19.80,'Wind','Ready-to-build',200,2029],\n      ['Västra Götaland','SE',58.20,12.60,'Wind','Greenfield',120,2030],\n      ['Ostrobothnia Tuuli','FI',63.10,21.80,'Wind','Ready-to-build',180,2029],\n      ['Lapland Ridge','FI',66.50,25.70,'Wind','Greenfield',160,2031],\n      ['Schleswig Wind','DE',54.40,9.40,'Wind','Construction',100,2027],\n      ['Eifel Höhen','DE',50.30,6.60,'Wind','Greenfield',65,2030],\n      ['Pomorskie Wiatr','PL',54.20,18.00,'Wind','Ready-to-build',130,2029],\n      ['Mazowsze Wind','PL',52.40,21.00,'Wind','Greenfield',90,2030],\n      ['Bretagne Éolien','FR',48.20,-3.20,'Wind','Ready-to-build',70,2028],\n      ['Champagne Crest','FR',48.90,4.30,'Wind','Construction',55,2027],\n      ['Galicia Ventos','ES',42.90,-8.00,'Wind','Ready-to-build',95,2028],\n      ['Aragón Wind','ES',41.30,-0.50,'Wind','Greenfield',140,2030],\n      ['Alentejo Vento','PT',38.40,-8.20,'Wind','Ready-to-build',60,2029],\n      ['Thrace Wind','GR',41.10,25.40,'Wind','Greenfield',85,2030],\n      ['Apennine Ridge','IT',42.10,13.40,'Wind','Ready-to-build',50,2029],\n      ['Groningen Wind','NL',53.30,6.80,'Wind','Construction',70,2027],\n      ['Dobrogea Wind','RO',44.80,28.60,'Wind','Ready-to-build',150,2029],\n      ['Scottish Borders','UK',55.50,-3.00,'Wind','Greenfield',130,2031],\n      ['Hornsea Fringe','UK',53.90,1.80,'Offshore wind','Greenfield',400,2032],\n      ['Kriegers Flak II','DK',55.10,13.00,'Offshore wind','Ready-to-build',350,2031],\n      ['Borssele Extension','NL',51.70,3.00,'Offshore wind','Construction',300,2029],\n      ['Baltica Nord','PL',54.80,17.50,'Offshore wind','Greenfield',450,2032]\n    ];\n    const cfSolar = {ES:0.245,PT:0.235,IT:0.215,GR:0.222,FR:0.172,DE:0.128,PL:0.118,NL:0.120,RO:0.158,IE:0.108,SE:0.108,FI:0.098,DK:0.118,UK:0.110};\n    const cfWind  = {DK:0.402,IE:0.381,UK:0.362,SE:0.348,FI:0.336,DE:0.281,NL:0.318,PL:0.292,FR:0.268,ES:0.271,PT:0.262,IT:0.231,GR:0.283,RO:0.284};\n    const merch   = {DE:73,ES:58,IT:92,FR:67,PL:80,NL:74,GR:84,SE:42,FI:45,DK:59,RO:80,IE:85,PT:56,UK:82};\n    const names   = {ES:'Spain',PT:'Portugal',IT:'Italy',GR:'Greece',FR:'France',DE:'Germany',PL:'Poland',RO:'Romania',NL:'Netherlands',DK:'Denmark',IE:'Ireland',SE:'Sweden',FI:'Finland',UK:'United Kingdom'};\n    const ccy     = {ES:'EUR',PT:'EUR',IT:'EUR',GR:'EUR',FR:'EUR',DE:'EUR',NL:'EUR',IE:'EUR',FI:'EUR',PL:'PLN',RO:'RON',DK:'DKK',SE:'SEK',UK:'GBP'};\n    const iso3    = {ES:'ESP',PT:'PRT',IT:'ITA',GR:'GRC',FR:'FRA',DE:'DEU',PL:'POL',RO:'ROU',NL:'NLD',DK:'DNK',IE:'IRL',SE:'SWE',FI:'FIN',UK:'GBR'};\n\n    return raw.map((r, i) => {\n      const [name, cc, lat, lon, tech, stage, mw, cod] = r;\n      const rnd = this.seeded(i * 97 + 13);\n      const off = tech === 'Offshore wind';\n      const solar = tech === 'Solar';\n      const cf = off ? 0.49 + rnd() * 0.06 : solar ? cfSolar[cc] * (0.94 + rnd() * 0.12) : cfWind[cc] * (0.94 + rnd() * 0.12);\n      const opexKw = off ? 78 + rnd() * 20 : solar ? 12 + rnd() * 4 : 42 + rnd() * 12;\n      const capture = off ? 0.86 : solar ? 0.68 : 0.88;\n      const riskBase = stage === 'Greenfield' ? 3.4 : stage === 'Ready-to-build' ? 2.2 : 1.5;\n      const devRisk = Math.min(5, Math.max(1, Math.round((riskBase + (off ? 0.8 : 0) + rnd() * 1.2) * 10) / 10));\n      const gridSecured = stage !== 'Greenfield' ? true : rnd() > 0.45;\n      const omPartner = stage === 'Construction' ? true : rnd() > 0.35;\n      const ppaShare = Math.round((stage === 'Construction' ? 0.65 + rnd() * 0.3 : stage === 'Ready-to-build' ? 0.45 + rnd() * 0.4 : 0.15 + rnd() * 0.5) * 100) / 100;\n      const capturePrice = Math.round(merch[cc] * capture);\n      const ppaPrice = Math.round(capturePrice * (0.86 + rnd() * 0.14));\n      const ppaTenor = ppaShare > 0.05 ? [10, 12, 15, 15, 20][Math.floor(rnd() * 5)] : 0;\n      const maxGear = stage === 'Construction' ? 0.75 : stage === 'Ready-to-build' ? 0.72 : 0.65;\n      // Entry pricing: a developer sells at an EBITDA yield that reflects how de-risked\n      // the asset is, so capex per kW falls out of the revenue case rather than the reverse.\n      const deg0 = solar ? 0.005 : 0.002;\n      const gen1 = mw * 8.760 * cf * (1 - deg0);\n      const price1 = ppaTenor > 1 ? ppaShare * ppaPrice * 1.005 + (1 - ppaShare) * capturePrice * 1.021 : capturePrice * 1.021;\n      const ebitda1 = gen1 * 1000 * price1 / 1e6 - mw * 1000 * opexKw * 1.021 / 1e6;\n      const yieldTarget = (off ? 0.090 : stage === 'Greenfield' ? 0.116 : stage === 'Ready-to-build' ? 0.103 : 0.095) + (rnd() - 0.5) * 0.014;\n      const band = off ? [2200, 3400] : solar ? [560, 950] : [1050, 1700];\n      const capexKw = Math.min(band[1], Math.max(band[0], ebitda1 / yieldTarget / mw / 1000 * 1e6));\n      const capex = mw * 1000 * capexKw / 1e6;\n      const p = { id: 'P' + String(i + 1).padStart(2, '0'), name, cc, country: names[cc], iso3: iso3[cc], lat, lon, tech, stage, mw, cod, cf, capexKw, opexKw, devRisk, gridSecured, omPartner, ppaShare, ppaPrice, ppaTenor, merchant: capturePrice, baseload: merch[cc], maxGear, capex, ccy: ccy[cc], eur: ccy[cc] === 'EUR' };\n      this.model(p);\n      return p;\n    });\n  }\n\n  seeded(s) { let x = s >>> 0 || 1; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }\n\n  // ── project cash-flow model, 30 years from 2027 ─────────────────────────\n  model(p) {\n    const Y0 = 2027, N = 30, rate = 0.055, tenor = 18;\n    const deg = p.tech === 'Solar' ? 0.005 : 0.002;\n    const build = Math.max(1, p.cod - Y0);\n    // Debt is sculpted to a 1.40× base-case DSCR, then capped by maximum gearing —\n    // weaker assets simply carry less leverage rather than being unfinanceable.\n    const af = rate / (1 - Math.pow(1 + rate, -tenor));\n    const gen1 = p.mw * 8.760 * p.cf * (1 - deg);\n    const price1 = p.ppaTenor > 1\n      ? p.ppaShare * p.ppaPrice * 1.005 + (1 - p.ppaShare) * p.merchant * 1.021\n      : p.merchant * 1.021;\n    const ebitda1 = gen1 * 1000 * price1 / 1e6 - p.mw * 1000 * p.opexKw * 1.021 / 1e6;\n    p.debt = Math.max(0, Math.min(p.maxGear * p.capex, ebitda1 / 1.40 / af));\n    p.lev = p.debt / p.capex;\n    p.equity = p.capex - p.debt;\n    const ann = p.debt * af;\n    const depr = p.capex / 25;\n    const eq = [], ebitdaArr = [], genArr = [];\n    let outstanding = p.debt;\n    for (let t = 0; t < N; t++) {\n      const yr = Y0 + t;\n      let cf = 0, ebitda = 0, gwh = 0;\n      if (yr < p.cod) cf -= p.equity / build;\n      else if (t === 0 && p.cod <= Y0) cf -= p.equity;\n      if (yr >= p.cod) {\n        const age = yr - p.cod;\n        gwh = p.mw * 8.760 * p.cf * Math.pow(1 - deg, age) * (age === 0 ? 0.55 : 1);\n        const underPpa = p.ppaTenor > 0 && age < p.ppaTenor;\n        const price = underPpa\n          ? p.ppaShare * p.ppaPrice * Math.pow(1.005, age) + (1 - p.ppaShare) * p.merchant * Math.pow(1.021, age)\n          : p.merchant * Math.pow(1.021, age);\n        const rev = gwh * 1000 * price / 1e6;\n        const opex = p.mw * 1000 * p.opexKw * Math.pow(1.021, age) / 1e6;\n        ebitda = rev - opex;\n        const interest = age < tenor ? outstanding * rate : 0;\n        const principal = age < tenor ? Math.max(0, ann - interest) : 0;\n        if (age < tenor) outstanding = Math.max(0, outstanding - principal);\n        const taxable = ebitda - interest - (age < 25 ? depr : 0);\n        const tax = Math.max(0, taxable * 0.20);\n        cf += ebitda - interest - principal - tax;\n      }\n      eq.push(cf); ebitdaArr.push(ebitda); genArr.push(gwh);\n    }\n    p.cfEquity = eq; p.ebitda = ebitdaArr; p.gen = genArr;\n    p.gwh = p.mw * 8.760 * p.cf;\n    // min DSCR over the debt life\n    let minD = 99;\n    let o = p.debt;\n    for (let t = 0; t < N; t++) {\n      const yr = Y0 + t, age = yr - p.cod;\n      if (age < 0 || age >= tenor) continue;\n      const interest = o * rate, principal = Math.max(0, ann - interest);\n      o = Math.max(0, o - principal);\n      if (age === 0) continue;\n      minD = Math.min(minD, ebitdaArr[t] / ann);\n    }\n    p.dscr = Math.round(Math.min(minD, 3.2) * 100) / 100;\n    // LCOE, 6% real\n    let pvC = p.capex, pvG = 0;\n    for (let t = 0; t < N; t++) {\n      const d = Math.pow(1.06, t + 1), age = Y0 + t - p.cod;\n      if (age >= 0) { pvC += p.mw * 1000 * p.opexKw / 1e6 / d; pvG += genArr[t] * 1000 / d; }\n    }\n    p.lcoe = pvG > 0 ? Math.round(pvC * 1e6 / pvG) : 0;\n    p.irr30 = this.irr(eq);\n  }\n\n  irr(cf) {\n    const npv = (r) => cf.reduce((a, c, i) => a + c / Math.pow(1 + r, i + 1), 0);\n    let lo = -0.5, hi = 1.2;\n    if (npv(lo) * npv(hi) > 0) return null;\n    for (let i = 0; i < 70; i++) { const m = (lo + hi) / 2; if (npv(lo) * npv(m) <= 0) hi = m; else lo = m; }\n    return (lo + hi) / 2;\n  }\n\n  holdCf(p, hold) {\n    const exit = Math.min(hold, 30);\n    const cf = p.cfEquity.slice(0, exit).slice();\n    const base = this.props.exitMultiple ?? 9;\n    const mult = p.tech === 'Solar' ? base : p.tech === 'Wind' ? base - 0.5 : base + 0.5;\n    const ebitdaExit = p.ebitda[exit - 1] || 0;\n    let o = p.debt, ann = p.debt * 0.055 / (1 - Math.pow(1.055, -18));\n    for (let t = 0; t < exit; t++) { const age = 2027 + t - p.cod; if (age >= 0 && age < 18) { const int = o * 0.055; o = Math.max(0, o - Math.max(0, ann - int)); } }\n    cf[exit - 1] = (cf[exit - 1] || 0) + Math.max(0, ebitdaExit * mult - o);\n    return cf;\n  }\n\n  projIrr(p, hold h.min(1.2, (a.irrApprox - s.hurdle / 100) / 0.05));\n    f += 0.9 * (a.equity / s.capital);\n    f -= 7 * Math.max(0, s.minLev / 100 - a.lev);\n    f -= 14 * Math.max(0, a.merchant - s.maxMerchant / 100);\n    f -= 1.6 * Math.max(0, a.risk - ({ Low: 2.4, Balanced: 3.2, High: 4.2 })[s.risk]);\n    let cp = 0; Object.keys(a.byC).forEach(c => { cp += Math.max(0, a.byC[c] / a.capex - s.maxCountry / 100); });\n    f -= 8 * cp;\n    let pp = 0; sel.forEach(p => { pp += Math.max(0, p.capex / a.capex - s.maxProject / 100); });\n    f -= 8 * pp;\n    return f;\n  }\n\n  run = () => {\n    const s = this.state;\n    const pool = this.eligible(s);\n    if (!pool.length) return;\n    const effort = { Fast: [50, 35], Standard: [90, 60], Exhaustive: [160, 110] }[this.props.algorithmEffort ?? 'Standard'] || [90, 60];\n    const N = pool.length, POP = effort[0], G = effort[1];\n    this.setState({ popSize: POP, genTotal: G });\n    const lockedIdx = pool.map((p, i) => s.locked.includes(p.id) ? i : -1).filter(i => i >= 0);\n    const rnd = this.seeded(Date.now() % 100000);\n    const force = g => { lockedIdx.forEach(i => g[i] = 1); return g; };\n    let pop = [];\n    for (let i = 0; i < POP; i++) pop.push(force(Array.from({ length: N }, () => rnd() < 0.35 ? 1 : 0)));\n    this.setState({ screen: 'running', gen: 0, hist: [], best: null, hover: null, dirty: false });\n\n    const step = () => {\n      const scored = pop.map(g => ({ g, f: this.fitness(g, pool, s) })).sort((a, b) => b.f - a.f);\n      const mean = scored.reduce((a, x) => a + x.f, 0) / scored.length;\n      const next = [scored[0].g, scored[1].g];\n      const pick = () => { const a = scored[Math.floor(rnd() * POP)], b = scored[Math.floor(rnd() * POP)]; return a.f > b.f ? a.g : b.g; };\n      while (next.length < POP) {\n        const p1 = pick(), p2 = pick(), c = [];\n        for (let i = 0; i < N; i++) { let bit = rnd() < 0.5 ? p1[i] : p2[i]; if (rnd() < 0.025) bit = bit ? 0 : 1; c.push(bit); }\n        next.push(forc ign: 'right' },\n      { key: 'capex', label: 'Capex €m', align: 'right' }, { key: 'equity', label: 'Equity €m', align: 'right' },\n      { key: 'lev', label: 'Lev', align: 'right' }, { key: 'cf', label: 'Cap. factor', align: 'right' },\n      { key: 'gwh', label: 'P50 GWh/y', align: 'right' }, { key: 'lcoe', label: 'LCOE €/MWh', align: 'right' },\n      { key: 'offtake', label: 'Contracted', align: 'right' }, { key: 'irr', label: 'Equity IRR', align: 'right' },\n      { key: 'dscr', label: 'Min DSCR', align: 'right' }, { key: 'risk', label: 'Risk', align: 'right' }\n    ].map(c => ({\n      label: c.label, align: c.align,\n      arrow: s.sortKey === c.key ? (s.sortDir === 1 ? ' ↑' : ' ↓') : '',\n      sort: () => { if (c.key === 'lock') return; this.setState({ sortKey: c.key, sortDir: s.sortKey === c.key ? -s.sortDir : -1 }); }\n    }));\n\n    const selIds = sel.map(p => p.id);\n    const rowVals = rows.map(p => ({\n      name: p.name, country: p.country + ' · ' + p.id, tech: p.tech, stage: p.stage,\n      mw: this.n0(p.mw), cod: String(p.cod), capex: this.n0(p.capex), equity: this.n0(p.equity),\n      lev: this.pct(p.lev, 0), cf: this.pct(p.cf, 1), gwh: this.n0(p.gwh), lcoe: this.n0(p.lcoe),\n      offtake: this.pct(p.ppaShare, 0), irr: this.pct(this.projIrr(p, s.hold) || 0),\n      dscr: p.dscr.toFixed(2) + '×', dscrColor: p.dscr < s.minDscr ? 'var(--color-accent-800)' : 'inherit',\n      risk: p.devRisk.toFixed(1),\n      bg: s.locked.includes(p.id) ? 'var(--color-accent-100)' : (selIds.includes(p.id) ? 'transparent' : 'var(--color-neutral-200)'),\n      lockMark: s.locked.includes(p.id) ? '■' : '□',\n      lockColor: s.locked.includes(p.id) ? 'var(--color-accent-700)' : 'var(--color-neutral-500)',\n      open: () => this.setState({ drawer: p.id }),\n      toggleLock: e => { e.stopPropagation(); this.setState({ locked: s.locked.includes(p.id) ? s.locked.filter(x => x !== p.id) : s.locked.concat([p.id]), dirty: true }); }\n    }));\n\n    // drawer\n    let d = null;\n    if (s.drawer) {\n      const p = this.projects.find(x => x.id === s.drawer);\n      if (p) {\n        const irr = this.projIrr(p, s.hold) || 0;\n        const hc = this.holdCf(p, s.hold);\n        const inf = hc.reduce((a, x) => a + Math.max(0, x), 0), outf = -hc.reduce((a, x) => a + Math.min(0, x), 0);\n        const pay = p.cfEquity.reduce((acc2, x, i) => { if (acc2.done) return acc2; acc2.sum += x; if (acc2.sum >= 0 && i > 2) { acc2.done = true; acc2.yr = 2027 + i; } return acc2; }, { sum: 0, done: false, yr: null });\n        d = {\n          name: p.name, tech: p.tech, stage: p.stage,\n          location: p.country + ' · ' + p.lat.toFixed(2) + '°, ' + p.lon.toFixed(2) + '° · ' + p.id,\n          headline: [\n            { label: 'Capacity', value: this.n0(p.mw) + ' MW' },\n            { label: 'Equity IRR (' + s.hold + 'y)', value: this.pct(irr) },\n            { label: 'Equity', value: '€' + this.n0(p.equity) + 'm' },\n            { label: 'MOIC', value: (outf > 0 ? inf / outf : 0).toFixed(2) + '×' }\n          ],\n          groups: [\n            { title: 'Technical', rows: [\n              { k: 'Net capacity factor', val: this.pct(p.cf, 1) },\n              { k: 'P50 generation', val: this.n0(p.gwh) + ' GWh/yr' },\n              { k: 'Commercial operation', val: String(p.cod) },\n              { k: 'Grid connection', val: p.gridSecured ? 'Secured' : 'Application pending' },\n              { k: 'O&M', val: p.omPartner ? 'Long-term service agreement signed' : 'Not contracted' }\n            ] },\n            { title: 'Capital structure', rows: [\n              { k: 'Total project cost', val: '€' + this.n0(p.capex) + 'm (€' + this.n0(p.capexKw) + '/kW)' },\n              { k: 'Senior debt', val: '€' + this.n0(p.debt) + 'm at ' + this.pct(p.lev, 0) + ', 5.5%, 18y' },\n              { k: 'Minimum DSCR', val: p.dscr.toFixed(2) + '×' },\n              { k: 'Equity payback', val: pay.yr ? String(pay.yr) : 'beyond 2056' },\n              { k: 'Currency', val: p.ccy + (p.eur ? '' : ' — hedge required') }\n            ] },\n            { title: 'Revenue', rows: [\n              { k: 'Contracted share', val: this.pct(p.ppaShare, 0) },\n              { k: 'PPA price', val: p.ppaTenor ? '€' + p.ppaPrice + '/MWh for ' + p.ppaTenor + ' yrs' : 'merchant only' },\n              { k: 'Capture price', val: '€' + p.merchant + '/MWh (baseload €' + p.baseload + ')' },\n              { k: 'LCOE', val: '€' + this.n0(p.lcoe) + '/MWh' },\n              { k: 'Opex', val: '€' + p.opexKw.toFixed(0) + '/kW/yr' }\n            ] },\n            { title: 'Risk', rows: [\n              { k: 'Development risk score', val: p.devRisk.toFixed(1) + ' / 5' },\n              { k: 'Status in portfolio', val: selIds.includes(p.id) ? 'Selected' : (s.excluded.includes(p.id) ? 'Excluded' : 'Not selected') },\n              { k: 'Locked', val: s.locked.includes(p.id) ? 'Yes — forced into next run' : 'No' }\n            ] }\n          ],\n          lockLabel: s.locked.includes(p.id) ? 'Unlock' : 'Lock into portfolio',\n          excludeLabel: s.excluded.includes(p.id) ? 'Re-admit candidate' : 'Exclude from search'\n        };\n      }\n    }\n\n    h.exportCsv = () => {\n      const head = 'ID,Project,Country,Technology,Stage,MW,COD,Capex EURm,Equity EURm,Leverage,Capacity factor,P50 GWh,LCOE EUR/MWh,Contracted share,Equity IRR,Min DSCR,Risk\\n';\n      const body = sel.map(p => [p.id, p.name, p.country, p.tech, p.stage, p.mw, p.cod, p.capex.toFixed(1), p.equity.toFixed(1), (p.lev * 100).toFixed(0) + '%', (p.cf * 100).toFixed(1) + '%', p.gwh.toFixed(0), p.lcoe, (p.ppaShare * 100).toFixed(0) + '%', ((this.projIrr(p, s.hold) || 0) * 100).toFixed(1) + '%', p.dscr.toFixed(2), p.devRisk].join(',')).join('\\n');\n      this.download('portfolio-holdings.csv', head + body);\n    };\n    h.exportCashflow = () => {\n      const body = 'Year,FCFE EURm\\n' + fcf.map((x, i) => (2027 + i) + ',' + x.toFixed(2)).join('\\n');\n      this.download('portfolio-cashflow.csv', body);\n    };\n\n    const hoverLabel = s.hover !== null && fcf.length ? (2027 + s.hover) + ': €' + this.n1(fcf[s.hover]) + 'm' : 'hover a bar';\n\n    return {\n      isInput: s.screen === 'input', isRunning: s.screen === 'running', isResults: s.screen === 'results',\n      stepColor1: s.screen === 'input' ? acc : mute,\n      stepColor2: s.screen === 'running' ? acc : mute,\n      stepColor3: s.screen === 'results' ? acc : mute,\n      v, h, countryChips, stageChips, riskOptions, riskNote, toggles, warnings,\n      countryToggleLabel: s.countries.length === 14 ? 'Clear all' : 'Select all',\n      toggleHover: { background: 'color-mix(in srgb, var(--color-text) 5%, transparent)' },\n      poolCount: this.projects.length, poolMw: this.n0(poolMw),\n      eligibleCount: pool.length, eligibleMw: this.n0(elig.mw), eligibleEquity: this.n0(elig.equity),\n      runDisabled: pool.length === 0,\n      popSize: s.popSize, genTotal: s.genTotal, genLabel: String(s.gen).padStart(2, '0'),\n      progressPct: Math.round(s.gen / s.genTotal * 100) + '%',\n      curveBest: pt(hist, 0), curveAvg: pt(hist, 1), liveStats,\n      logLine: s.gen < 8 ? 'seeding population · evaluating constraint feasibility' : s.gen < 30 ? 'crossover and mutation · pruning infeasible portfolios' : 'converging on elite solution · computing levered returns',\n      tiles, bars, cumFcf, axisTop, axisBottom, zeroLine, hoverLabel,\n      mapDisplay: (this.props.showMap ?? true) ? 'block' : 'none',\n      mapRef: el => { this._map = el; },\n      resultSubtitle: agg ? this.n0(agg.mw) + ' MW across ' + agg.n + ' projects in ' + Object.keys(agg.byC).length + ' countries · ' + s.hold + '-year hold · run ' + s.runRef : '',\n      rerunLabel: s.dirty ? 'Re-run with changes' : 'Re-run',\n      columns, rows: rowVals,\n      tableCountLabel: rowVals.length + ' of ' + (s.showAll ? pool.length + ' eligible candidates' : sel.length + ' selected'),\n      showAllCls: s.showAll ? 'tag tag-accent' : 'tag tag-outline',\n      showAllLabel: s.showAll ? 'Showing all candidates' : 'Show all candidates',\n      countryOptions: ['All'].concat(Array.from(new Set(base.map(p => p.country))).sort()).map(x => ({ value: x, label: x === 'All' ? 'All countries' : x })),\n      techOptions: ['All','Solar','Wind','Offshore wind'].map(x => ({ value: x, label: x === 'All' ? 'All technologies' : x })),\n      stageOptions: ['All','Greenfield','Ready-to-build','Construction'].map(x => ({ value: x, label: x === 'All' ? 'All stages' : x })),\n      drawerOpen: !!d, d: d || { headline: [], groups: [] },\n      runRef: s.runRef, exportRowCount: sel.length\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
